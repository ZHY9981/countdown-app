<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="https://countdown.local/">
  <link rel="stylesheet" href="vendor/flip.min.css">
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #0f151a;
      --panel: #141c22;
      --panel-strong: #172027;
      --text: #f5f7f4;
      --muted: #8d9995;
      --soft: #b7ccc7;
      --line: rgba(217, 230, 226, .13);
      --line-soft: rgba(217, 230, 226, .08);
      --accent: #e4b36a;
      --accent-soft: rgba(228, 179, 106, .36);
      --urgent: #efc27f;
      --today: #b7ccc7;
      --tile: #070a0d;
      --tile-text: #f7fbf8;
      --tile-border: 1px solid rgba(255, 255, 255, .055);
      --tile-shadow: none;
      --tile-divider: rgba(255, 255, 255, .06);
      --status-bg: rgba(159, 187, 181, .12);
      --status-text: #b7ccc7;
      --urgent-bg: rgba(231, 174, 92, .14);
      --today-bg: rgba(159, 187, 181, .13);
      --ended-bg: rgba(170, 181, 178, .08);
      --hover-bg: rgba(217, 230, 226, .035);
      --selected-bg: rgba(228, 179, 106, .045);
      --scroll-thumb: rgba(217, 230, 226, .17);
      --progress-track: rgba(217, 230, 226, .11);
    }
    html[data-theme="light"] {
      --bg: #f2f4f7;
      --panel: #f8f9fb;
      --panel-strong: #eef1f4;
      --text: #172029;
      --muted: #74808a;
      --soft: #53636a;
      --line: #d7dde4;
      --line-soft: #e1e6eb;
      --accent: #4f777a;
      --accent-soft: rgba(79, 119, 122, .36);
      --urgent: #8b6424;
      --today: #4f777a;
      --tile: #e5eaed;
      --tile-text: #182028;
      --tile-border: 1px solid rgba(44, 55, 64, .18);
      --tile-shadow: 0 4px 10px rgba(27, 33, 38, .10);
      --tile-divider: rgba(31, 41, 49, .12);
      --status-bg: #e8eef1;
      --status-text: #53636a;
      --urgent-bg: #f5ead7;
      --today-bg: #e2ecee;
      --ended-bg: #e8ecef;
      --hover-bg: rgba(93, 112, 124, .055);
      --selected-bg: rgba(79, 119, 122, .08);
      --scroll-thumb: rgba(92, 108, 119, .24);
      --progress-track: rgba(79, 119, 122, .14);
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
      user-select: none;
    }
    .app {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: minmax(0, 57fr) minmax(0, 43fr);
      grid-template-rows: 34px minmax(0, 1fr);
      column-gap: 30px;
      row-gap: 8px;
      padding: 10px 36px 22px;
    }
    .topbar {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }
    .widget-button {
      height: 32px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 7px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--text);
      background: var(--panel);
      font-family: inherit;
      font-size: 10px;
      font-weight: 750;
      cursor: pointer;
    }
    .widget-button:hover {
      background: var(--hover-bg);
    }
    .widget-button svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: var(--muted);
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    #hero-slot {
      grid-column: 1;
      grid-row: 2;
      min-width: 0;
      min-height: 0;
      display: flex;
    }
    #hero-slot > .card {
      width: 100%;
    }
    .agenda-list {
      grid-column: 2;
      grid-row: 2;
      min-width: 0;
      min-height: 0;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      display: grid;
      grid-auto-flow: row;
      grid-auto-rows: calc((100% - 16px) / 3);
      gap: 8px;
      align-content: start;
    }
    .agenda-list::-webkit-scrollbar { width: 6px; }
    .agenda-list::-webkit-scrollbar-thumb {
      background: var(--scroll-thumb);
      border-radius: 8px;
    }
    .card {
      position: relative;
      min-width: 0;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      backface-visibility: hidden;
    }
    .card.hero {
      flex: 1;
      min-height: 0;
      padding: 8px 6px 0 27px;
      border: 0;
      border-left: 2px solid var(--accent);
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }
    .card.compact {
      padding: 17px 9px 15px 17px;
      border: 0;
      border-left: 2px solid var(--accent);
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      transition: background-color .15s ease;
    }
    .card.compact:hover {
      background: var(--hover-bg);
    }
    .card.compact.selected {
      background: var(--selected-bg);
    }
    .card-head,
    .hero-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .hero-head > div:first-child,
    .card-head > div:first-child {
      min-width: 0;
    }
    .kicker {
      margin-bottom: 7px;
      color: var(--accent);
      font-size: 10px;
      line-height: 1;
      font-weight: 800;
    }
    .name {
      color: var(--text);
      font-size: 21px;
      line-height: 1.18;
      font-weight: 760;
    }
    .hero .name {
      font-size: 40px;
      line-height: 1.12;
    }
    .date {
      margin-top: 5px;
      color: var(--muted);
      font-size: 10px;
    }
    .hero .date {
      margin-top: 7px;
      font-size: 11px;
    }
    .status {
      height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
      background: var(--status-bg);
      color: var(--status-text);
      font-size: 9px;
      font-weight: 800;
    }
    .status.urgent {
      color: var(--urgent);
      background: var(--urgent-bg);
    }
    .status.today {
      color: var(--today);
      background: var(--today-bg);
    }
    .status.ended {
      color: var(--muted);
      background: var(--ended-bg);
    }
    .clock {
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
    }
    .hero .clock {
      margin-top: auto;
      padding-bottom: 4px;
    }
    .compact .clock {
      margin-top: auto;
    }
    .hero-progress {
      margin-top: 30px;
      display: grid;
      grid-template-columns: 174px minmax(0, 1fr);
      align-items: center;
      gap: 22px;
    }
    .progress-ring {
      position: relative;
      width: 174px;
      height: 174px;
      border-radius: 50%;
      background: conic-gradient(
        var(--accent) 0 var(--progress),
        var(--progress-track) var(--progress) 100%
      );
    }
    .progress-ring::before {
      content: "";
      position: absolute;
      inset: 13px;
      border-radius: 50%;
      background: var(--bg);
      box-shadow: inset 0 0 0 1px var(--line-soft);
    }
    .progress-ring.no-progress {
      background: var(--progress-track);
    }
    .progress-core {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .progress-percent {
      color: var(--text);
      font-family: Bahnschrift, "Segoe UI", sans-serif;
      font-size: 36px;
      line-height: 1;
      font-weight: 520;
    }
    .progress-caption {
      margin-top: 6px;
      color: var(--muted);
      font-size: 8px;
      font-weight: 800;
    }
    .progress-meta {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }
    .progress-meta-item {
      position: relative;
      padding-left: 14px;
    }
    .progress-meta-item::before {
      content: "";
      position: absolute;
      left: 0;
      top: 3px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--muted);
    }
    .progress-meta-item.current::before { background: var(--accent); }
    .progress-meta-label {
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 8px;
      font-weight: 700;
    }
    .progress-meta-value {
      color: var(--text);
      font-size: 10px;
      font-weight: 650;
      white-space: nowrap;
    }
    .compact-progress {
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .compact-progress-track {
      flex: 1;
      height: 3px;
      border-radius: 999px;
      overflow: hidden;
      background: var(--progress-track);
    }
    .compact-progress-fill {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
    }
    .compact-progress-label {
      flex: none;
      color: var(--muted);
      font-size: 8px;
      font-weight: 800;
    }
    .countdown-tick {
      width: 100%;
      text-align: left;
      font-family: "Segoe UI", sans-serif;
      font-variant-numeric: tabular-nums;
      padding-bottom: .52em;
    }
    .hero .countdown-tick { font-size: 46px; }
    .compact .countdown-tick { font-size: 24px; }
    .countdown-tick [data-layout~="horizontal"] {
      justify-content: flex-start;
    }
    .countdown-tick .tick-group {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      vertical-align: bottom;
      flex: 0 0 auto;
    }
    .countdown-tick .tick-group + .tick-group {
      margin-left: .18em;
    }
    .countdown-tick .tick-label {
      margin-top: .12em;
      color: var(--muted);
      font-size: .24em;
      font-weight: 700;
      letter-spacing: 0;
      text-indent: 0;
      white-space: nowrap;
    }
    .countdown-tick .tick-flip {
      position: relative;
      margin-left: .03em;
      margin-right: .03em;
      color: var(--tile-text);
      border-radius: .11em;
      border: var(--tile-border);
      box-shadow: var(--tile-shadow);
      font-family: Bahnschrift, "Segoe UI", sans-serif;
      font-weight: 540;
      line-height: 1;
    }
    .countdown-tick .tick-flip::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 1px;
      background: var(--tile-divider);
      pointer-events: none;
      z-index: 8;
    }
    .countdown-tick .tick-flip-panel-front,
    .countdown-tick .tick-flip-panel-back {
      height: 50%;
    }
    .countdown-tick .tick-flip-panel-back { top: 50%; }
    .countdown-tick .tick-flip-panel {
      color: var(--tile-text);
      background-color: var(--tile);
      box-shadow: none;
    }
    .countdown-tick .tick-flip-panel-front,
    .countdown-tick .tick-flip-panel-back,
    .countdown-tick .tick-flip-shadow,
    .countdown-tick .tick-flip-card-shadow {
      box-shadow: none;
    }
    html[data-theme="light"] .countdown-tick .tick-flip-panel-back:after,
    html[data-theme="light"] .countdown-tick .tick-flip-panel-front-shadow,
    html[data-theme="light"] .countdown-tick .tick-flip-panel-back-shadow,
    html[data-theme="light"] .countdown-tick .tick-flip-panel-back-highlight {
      background-image: none;
      opacity: 0;
    }
    .countdown-tick .tick-credits { display: none !important; }
    .empty-card {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      align-items: center;
      justify-content: center;
    }
    .empty-card.hero {
      border-left: 2px dashed var(--accent-soft);
    }
    .empty-card.compact {
      border-left: 2px dashed var(--line);
    }
    @media (max-width: 900px) {
      .app {
        grid-template-columns: minmax(0, 55fr) minmax(0, 45fr);
        grid-template-rows: 32px minmax(0, 1fr);
        column-gap: 16px;
        row-gap: 7px;
        padding: 8px 18px 14px;
      }
      .hero .name { font-size: 31px; }
      .hero .countdown-tick { font-size: 36px; }
      .compact .name { font-size: 18px; }
      .compact .countdown-tick { font-size: 20px; }
      .hero-progress {
        grid-template-columns: 132px minmax(0, 1fr);
        gap: 16px;
        margin-top: 22px;
      }
      .progress-ring {
        width: 132px;
        height: 132px;
      }
      .progress-ring::before { inset: 10px; }
      .progress-percent { font-size: 29px; }
      .progress-meta { gap: 9px; }
      .progress-meta-value { font-size: 9px; }
      .card.compact {
        padding: 14px 7px 12px 14px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <button id="widget-button" class="widget-button" type="button">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M9 12h12"/></svg>
        组件
      </button>
    </div>
    <section id="hero-slot"></section>
    <section id="compact-stack" class="agenda-list"></section>
  </main>

  <script>
    window.__COUNTDOWN_STATE__ = __STATE_JSON__;
  </script>
  <script>
    (function () {
      var state = window.__COUNTDOWN_STATE__ || { selectedId: "", events: [] };
      document.documentElement.setAttribute(
        "data-theme",
        state.darkTheme === false ? "light" : "dark");
      var heroSlot = document.getElementById("hero-slot");
      var compactStack = document.getElementById("compact-stack");
      var widgetButton = document.getElementById("widget-button");

      widgetButton.addEventListener("click", function () {
        if (window.chrome && window.chrome.webview) {
          window.chrome.webview.postMessage({ type: "widget" });
        }
      });

      function createClockMarkup() {
        return [
          '<div class="tick countdown-tick" data-did-init="setupCountdownTick">',
          '  <div data-repeat="true" data-layout="horizontal center"',
          '       data-transform="preset(d, h, m, s) -> delay">',
          '    <div class="tick-group">',
          '      <div data-key="value" data-repeat="true" data-transform="pad(00) -> split -> delay">',
          '        <span data-view="flip"></span>',
          '      </div>',
          '      <span data-key="label" data-view="text" class="tick-label"></span>',
          '    </div>',
          '  </div>',
          '</div>'
        ].join("");
      }

      function appendProgressMeta(parent, label, value, current) {
        var item = document.createElement("div");
        item.className = "progress-meta-item" + (current ? " current" : "");
        var labelNode = document.createElement("div");
        labelNode.className = "progress-meta-label";
        labelNode.textContent = label;
        var valueNode = document.createElement("div");
        valueNode.className = "progress-meta-value";
        valueNode.textContent = value;
        item.appendChild(labelNode);
        item.appendChild(valueNode);
        parent.appendChild(item);
      }

      function makeHeroProgress(event) {
        var progress = document.createElement("div");
        progress.className = "hero-progress";

        var ring = document.createElement("div");
        ring.className = "progress-ring";
        var core = document.createElement("div");
        core.className = "progress-core";
        var percent = document.createElement("div");
        percent.className = "progress-percent";
        var caption = document.createElement("div");
        caption.className = "progress-caption";
        if (event.progressPercent >= 0) {
          ring.style.setProperty("--progress", event.progressPercent + "%");
          percent.textContent = event.progressPercent + "%";
          caption.textContent = "已过时间";
        }
        else {
          ring.className += " no-progress";
          percent.textContent = "--";
          caption.textContent = "进度未记录";
        }
        core.appendChild(percent);
        core.appendChild(caption);
        ring.appendChild(core);
        progress.appendChild(ring);

        var meta = document.createElement("div");
        meta.className = "progress-meta";
        appendProgressMeta(meta, "开始时间", event.startTimeText, false);
        appendProgressMeta(meta, "当前时间", event.currentTimeText, true);
        appendProgressMeta(meta, "目标时间", event.targetTimeText, false);
        progress.appendChild(meta);
        return progress;
      }

      function makeCompactProgress(event) {
        var progress = document.createElement("div");
        progress.className = "compact-progress";
        var track = document.createElement("span");
        track.className = "compact-progress-track";
        var fill = document.createElement("span");
        fill.className = "compact-progress-fill";
        var label = document.createElement("span");
        label.className = "compact-progress-label";
        if (event.progressPercent >= 0) {
          fill.style.width = event.progressPercent + "%";
          label.textContent = event.progressPercent + "%";
        }
        else {
          fill.style.width = "0";
          label.textContent = "未记录";
        }
        track.appendChild(fill);
        progress.appendChild(track);
        progress.appendChild(label);
        return progress;
      }

      function makeCard(event, featured) {
        var card = document.createElement("article");
        card.className = "card " + (featured ? "hero" : "compact");
        if (event.id === state.selectedId) card.classList.add("selected");
        card.dataset.id = event.id;

        var head = document.createElement("div");
        head.className = featured ? "hero-head" : "card-head";

        var info = document.createElement("div");
        if (featured) {
          var kicker = document.createElement("div");
          kicker.className = "kicker";
          kicker.textContent = "最近到期";
          info.appendChild(kicker);
        }

        var name = document.createElement("div");
        name.className = "name";
        name.textContent = event.name;
        info.appendChild(name);

        var date = document.createElement("div");
        date.className = "date";
        date.textContent = event.dateText;
        info.appendChild(date);
        head.appendChild(info);

        var status = document.createElement("span");
        status.className = "status " + (event.statusClass || "normal");
        status.textContent = event.statusText;
        head.appendChild(status);
        card.appendChild(head);

        card.appendChild(featured
          ? makeHeroProgress(event)
          : makeCompactProgress(event));

        var clock = document.createElement("div");
        clock.className = "clock";
        clock.innerHTML = createClockMarkup();
        var tick = clock.querySelector(".tick");
        tick.dataset.target = event.targetIso;
        tick.dataset.ended = event.ended ? "true" : "false";
        card.appendChild(clock);

        card.addEventListener("click", function () {
          state.selectedId = event.id;
          setSelected(event.id);
          if (window.chrome && window.chrome.webview) {
            window.chrome.webview.postMessage({ type: "select", id: event.id });
          }
        });
        return card;
      }

      function makeEmpty(featured) {
        var card = document.createElement("article");
        card.className = "card empty-card " + (featured ? "hero" : "compact");
        card.textContent = "添加一个倒计时";
        card.addEventListener("click", function () {
          if (window.chrome && window.chrome.webview) {
            window.chrome.webview.postMessage({ type: "add" });
          }
        });
        return card;
      }

      var events = state.events || [];
      heroSlot.appendChild(events.length > 0 ? makeCard(events[0], true) : makeEmpty(true));
      var compactCount = 0;
      for (var i = 1; i < events.length; i++) {
        compactStack.appendChild(makeCard(events[i], false));
        compactCount++;
      }
      while (compactCount < 3) {
        compactStack.appendChild(makeEmpty(false));
        compactCount++;
      }

      window.setupCountdownTick = function (tick) {
        tick.setConstant("DAY_PLURAL", "天");
        tick.setConstant("DAY_SINGULAR", "天");
        tick.setConstant("HOUR_PLURAL", "时");
        tick.setConstant("HOUR_SINGULAR", "时");
        tick.setConstant("MINUTE_PLURAL", "分");
        tick.setConstant("MINUTE_SINGULAR", "分");
        tick.setConstant("SECOND_PLURAL", "秒");
        tick.setConstant("SECOND_SINGULAR", "秒");

        if (tick.root.dataset.ended === "true") {
          tick.value = { d: 0, h: 0, m: 0, s: 0 };
          return;
        }

        Tick.count.down(new Date(tick.root.dataset.target)).onupdate = function (value) {
          tick.value = value;
        };
      };

      window.setSelected = function (id) {
        var cards = document.querySelectorAll(".card[data-id]");
        for (var i = 0; i < cards.length; i++) {
          cards[i].classList.toggle("selected", cards[i].dataset.id === id);
        }
      };
    })();
  </script>
  <script src="vendor/flip.min.js"></script>
</body>
</html>
