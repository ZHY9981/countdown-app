<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>我的倒计时</title>
<style>
  body {
    background: #f5f7fa;
    font-family: "Microsoft YaHei", sans-serif;
    max-width: 700px;
    margin: 40px auto;
    padding: 0 20px;
  }
  h1 { color: #1a1a1a; }

  /* 添加区：套一层白卡片，让它看起来像一块"操作区"，而不是散在那儿 */
  .add-panel {
    background: #fff;
    border-radius: 12px;
    padding: 16px 20px 8px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
  }
  .add-form { display: flex; gap: 8px; align-items: center; }
  .add-form input {
    padding: 8px 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.15s, background 0.15s;
  }
  .add-form input:focus { border-color: #3d5a80; }
  #nameInput { flex: 1; }
  .add-form input.invalid {          /* 没填的那一格：描红 + 淡红底，一眼看出漏了哪 */
    border-color: #e74c3c;
    background: #fff5f4;
  }
  .add-form button {
    padding: 8px 20px;
    border: none;
    border-radius: 8px;
    background: #3d5a80;             /* 沉稳的深蓝。红色专门留给"删除"，分工才清楚 */
    color: #fff;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .add-form button:hover { background: #32506f; }

  .add-hint {                        /* 填不全时的提示行。常占着位，页面不会上下跳 */
    min-height: 18px;
    font-size: 13px;
    line-height: 18px;
    color: #e74c3c;
  }

  /* 普通卡片：名字和天数一左一右 */
  .card {
    position: relative;         /* 当"坐标原点"，好让删除按钮贴到右边缘 */
    background: #fff;
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    display: flex;
    justify-content: space-between;
    align-items: center;
    /* 长按要"按得住"，得禁止选中文字、禁止手机上弹长按菜单 */
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    /* 长按唤出删除键、删除时卡片收起，都靠这几条过渡 */
    transition: padding 0.2s ease, height 0.25s ease,
                margin-bottom 0.25s ease, opacity 0.25s ease,
                border-width 0.25s ease;
  }
  .card.revealed { padding-right: 64px; }   /* 长按之后：右边让出位置给 × */
  .card .name { font-size: 18px; color: #333; }
  .card .days { font-size: 24px; font-weight: bold; color: #e74c3c; }

  .delete-btn {                 /* 长按卡片之后，才从右边缘滑出来的"删除"块 */
    position: absolute;
    right: 14px;
    top: 6px;                   /* 上下各留 6px —— 高度就跟着卡片走，卡片多高它多高 */
    bottom: 6px;
    width: 34px;
    display: flex;              /* 删、除 两个字上下排 */
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 8px;
    background: #e74c3c;        /* 红底白字，一眼就知道是"危险操作" */
    color: #fff;
    font-size: 16px;
    line-height: 1.2;
    font-family: inherit;
    cursor: pointer;
    padding: 0;
    z-index: 10;                /* 放在最上层，免得被翻页叶片盖住 */
    /* 平时藏在右边外面、点不到；长按后滑进来 */
    opacity: 0;
    pointer-events: none;
    transform: translateX(10px);
    transition: opacity 0.18s ease, transform 0.18s ease, background 0.15s ease;
  }
  .card.revealed .delete-btn {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(0);
  }
  .delete-btn:hover { background: #c0392b; }   /* 鼠标移上去颜色再深一点 */

  /* 第一张卡片（最紧迫）：放大 + 上下布局 + 红边框突出 */
  .card.featured {
    flex-direction: column;      /* 上下排，而不是左右 */
    justify-content: center;
    padding: 26px 20px;
    border: 2px solid #e74c3c;
  }
  .card.featured .name {
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 18px;
  }

  /* 翻页时钟容器 */
  .flip-clock {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 3px;
  }
  .flip-clock .group { display: flex; gap: 2px; }
  .flip-clock .label, .flip-clock .colon { font-size: 16px; color: #888; }

  /* 一个数字位（变小一点） */
  .digit {
    position: relative;
    display: inline-block;
    width: 46px;
    height: 70px;
    perspective: 350px;
    font-family: Consolas, monospace;
    font-weight: bold;
    font-size: 46px;
  }
  .panel {
    position: absolute;
    left: 0;
    width: 46px;
    height: 35px;
    overflow: hidden;
    background: #000;           /* 黑色叶片 */
    color: #fff;
  }
  .panel span {
    position: absolute;
    left: 0;
    width: 46px;
    height: 70px;
    line-height: 70px;
    text-align: center;         /* 数字水平居中 */
  }
  .top-static, .flap-top       { top: 0;    border-radius: 5px 5px 0 0; }
  .bottom-static, .flap-bottom { top: 35px; border-radius: 0 0 5px 5px; }
  .top-static span, .flap-top span       { top: 0; }
  .bottom-static span, .flap-bottom span { bottom: 0; }

  .flap-top {
    transform-origin: bottom;
    transition: transform 0.3s ease-in;
    z-index: 2;
  }
  .flap-bottom {
    transform-origin: top;
    transform: rotateX(90deg);
    transition: transform 0.3s ease-out 0.3s;
    z-index: 2;
  }

  /* 精选卡：时钟两边本来就有空位，× 直接待在右边缘，不用让位置 */
  .card.featured.revealed { padding-right: 20px; }

  /* 一个事件都没有时的提示 */
  .empty {
    text-align: center;
    color: #9aa3ad;
    padding: 48px 20px;
    font-size: 15px;
  }

  /* 底部那条"已删除 · 撤销"的提示条 */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    background: #2b2b2b;
    color: #fff;
    font-size: 15px;
    padding: 12px 18px;
    border-radius: 10px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, 16px);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .toast.show {
    opacity: 1;
    pointer-events: auto;
    transform: translate(-50%, 0);
  }
  .toast button {
    border: none;
    background: none;
    color: #ff9b8c;              /* 提示条里的"撤销" */
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    padding: 2px 4px;
  }
  .toast button:hover { color: #ffc4ba; }
</style>
</head>
<body>
  <h1>我的倒计时</h1>

  <div class="add-panel">
    <div class="add-form">
      <input id="nameInput" type="text" placeholder="要惦记的事，比如：考研">
      <input id="dateInput" type="date">
      <button id="addBtn">添加</button>
    </div>
    <div id="addHint" class="add-hint"></div>
  </div>

  <div id="list"></div>

  <div id="toast" class="toast"></div>

  <script>
    /* ===== 数据：打开时先试着从"存档"里读回来 ===== */
    function loadEvents() {
      const saved = localStorage.getItem('events');   /* 读存档 */
      if (saved) return JSON.parse(saved);            /* 有存档 → 把它从文字变回数组 */
      return [                                        /* 没有存档（第一次打开）→ 用默认两个 */
        { name: '2027 黑客松', date: '2027-06-01' },
        { name: '雅思考试',     date: '2026-10-25' },
      ];
    }

    function saveEvents() {
      localStorage.setItem('events', JSON.stringify(events));  /* 把数组变成文字，存起来 */
    }

    let events = loadEvents();

    function daysLeft(dateStr) {
      const ms = new Date(dateStr) - new Date();
      return Math.max(0, Math.ceil(ms / (1000 * 60 * 60 * 24)));   /* 过去的日子就算 0 天 */
    }

    /* ===== 翻页数字"工厂"（跟你之前写的翻页时钟一模一样） ===== */
    function makeDigit() {
      const el = document.createElement('div');
      el.className = 'digit';
      el.innerHTML =
        '<div class="panel top-static"><span>0</span></div>' +
        '<div class="panel bottom-static"><span>0</span></div>' +
        '<div class="panel flap-top"><span>0</span></div>' +
        '<div class="panel flap-bottom"><span>0</span></div>';

      const topStatic  = el.querySelector('.top-static span');
      const botStatic  = el.querySelector('.bottom-static span');
      const flapTop    = el.querySelector('.flap-top');
      const flapBottom = el.querySelector('.flap-bottom');
      const flapTopNum = el.querySelector('.flap-top span');
      const flapBotNum = el.querySelector('.flap-bottom span');

      let current = null;

      function setNow(ch) {          /* 直接摆好，不带动画 */
        current = ch;
        topStatic.textContent = ch;
        botStatic.textContent = ch;
        flapTopNum.textContent = ch;
        flapBotNum.textContent = ch;
      }

      function flipTo(next) {        /* 翻到某个字 */
        if (next === current) return;
        topStatic.textContent = next;
        botStatic.textContent = current;

        flapTop.style.transition = 'none';
        flapBottom.style.transition = 'none';
        flapTopNum.textContent = current;
        flapBotNum.textContent = next;
        flapTop.style.transform = 'rotateX(0deg)';
        flapBottom.style.transform = 'rotateX(90deg)';
        void flapTop.offsetWidth;

        flapTop.style.transition = 'transform 0.3s ease-in';
        flapTop.style.transform = 'rotateX(-90deg)';
        flapBottom.style.transition = 'transform 0.3s ease-out 0.3s';
        flapBottom.style.transform = 'rotateX(0deg)';

        setTimeout(() => {
          topStatic.textContent = next;
          botStatic.textContent = next;
          flapTopNum.textContent = next;
          flapTop.style.transition = 'none';
          flapBottom.style.transition = 'none';
          flapTop.style.transform = 'rotateX(0deg)';
          flapBottom.style.transform = 'rotateX(90deg)';
        }, 600);

        current = next;
      }

      return { el, setNow, flipTo };
    }

    /* ===== 翻页时钟：把 9 个翻转位拼成"天 时:分:秒" ===== */
    function buildFlipClock() {
      const clock = document.createElement('div');
      clock.className = 'flip-clock';
      const groups = {};

      function addGroup(key, count) {   /* 造一组数字位 */
        const g = document.createElement('div');
        g.className = 'group';
        const digits = [];
        for (let i = 0; i < count; i++) {
          const d = makeDigit();
          g.appendChild(d.el);
          digits.push(d);
        }
        clock.appendChild(g);
        groups[key] = digits;
      }
      function addLabel(text, cls) {    /* 造一个标签："天" 或 ":" */
        const s = document.createElement('span');
        s.className = cls || 'label';
        s.textContent = text;
        clock.appendChild(s);
      }

      addGroup('day', 3);
      addLabel('天');
      addGroup('hour', 2);
      addLabel(':', 'colon');
      addGroup('min', 2);
      addLabel(':', 'colon');
      addGroup('sec', 2);

      function pad(n, w) { return String(n).padStart(w, '0'); }

      function parts(dateStr) {         /* 把"距离目标还有多久"拆成天/时/分/秒 */
        let s = Math.floor((new Date(dateStr) - new Date()) / 1000);
        if (s < 0) s = 0;
        return {
          day:  pad(Math.floor(s / 86400), 3),
          hour: pad(Math.floor(s % 86400 / 3600), 2),
          min:  pad(Math.floor(s % 3600 / 60), 2),
          sec:  pad(s % 60, 2),
        };
      }

      function apply(dateStr, animate) {  /* animate=true 翻；false 直接摆 */
        const p = parts(dateStr);
        for (const key of ['day', 'hour', 'min', 'sec']) {
          const digits = groups[key];
          const chars = p[key].split('');
          for (let i = 0; i < digits.length; i++) {
            if (animate) digits[i].flipTo(chars[i]);
            else digits[i].setNow(chars[i]);
          }
        }
      }

      return { el: clock, apply };
    }

    /* ===== 长按卡片 → 删除块从右边缘滑出来 ===== */
    const RETRACT_MS = 3000;    /* 鼠标停着不动这么久，就自动收回 */

    let revealedCard = null;    /* 当前露出删除块的那张卡（同时只允许一张） */
    let retractTimer = null;    /* "收回"的倒计时 */

    function hideDelete() {     /* 把删除块收回去 */
      if (revealedCard) revealedCard.classList.remove('revealed');
      revealedCard = null;
      clearTimeout(retractTimer);
      retractTimer = null;
    }

    function armRetract() {     /* 重新开始"鼠标不动就收回"的倒计时 */
      clearTimeout(retractTimer);
      retractTimer = setTimeout(hideDelete, RETRACT_MS);
    }

    function revealDelete(card) {
      if (revealedCard && revealedCard !== card) revealedCard.classList.remove('revealed');
      card.classList.add('revealed');
      card.dataset.revealedAt = Date.now();   /* 记下露出来的时刻，用来防"一松手就误删" */
      revealedCard = card;
      armRetract();
    }

    /* 鼠标只要有动静就重新计时：一直在动就一直留着，停下来 3 秒才收回 */
    document.addEventListener('mousemove', () => {
      if (revealedCard) armRetract();
    });

    function attachLongPress(card) {
      let timer = null;
      function cancel() { if (timer) { clearTimeout(timer); timer = null; } }
      function start(e) {
        if (e.type === 'mousedown' && e.button !== 0) return;   /* 只认鼠标左键 */
        cancel();
        timer = setTimeout(() => { timer = null; revealDelete(card); }, 500);   /* 按住 0.5 秒 */
      }
      card.addEventListener('mousedown', start);
      card.addEventListener('touchstart', start, { passive: true });
      /* 提前松手、鼠标移开、手指滑动 → 都不算长按 */
      ['mouseup', 'mouseleave', 'touchend', 'touchcancel', 'touchmove']
        .forEach(ev => card.addEventListener(ev, cancel));
      /* 手机上长按会弹出系统菜单，挡掉它 */
      card.addEventListener('contextmenu', e => e.preventDefault());
    }

    /* ===== 造一张普通卡片 ===== */
    function makeCard(event) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML =
        '<span class="name">' + event.name + '</span>' +
        '<span class="days">' + daysLeft(event.date) + ' 天</span>';
      attachLongPress(card);
      card.appendChild(makeDeleteBtn(event, card));
      return card;
    }

    /* ===== 删除块：长按露出来之后才点得到 ===== */
    function makeDeleteBtn(event, card) {
      const btn = document.createElement('button');
      btn.className = 'delete-btn';
      btn.innerHTML = '<span>删</span><span>除</span>';   /* 两个字上下排 */
      btn.setAttribute('aria-label', '删除');

      btn.onclick = () => {
        if (btn.disabled) return;   /* 防手快双击，一次删掉两条 */
        /* 长按刚露出来的那一下不算数，免得手指一松就把它删了 */
        if (Date.now() - Number(card.dataset.revealedAt || 0) < 400) return;
        btn.disabled = true;
        delEvent(event, card);
      };
      return btn;
    }

    /* ===== 底部提示条："已删除 · 撤销" ===== */
    const toast = document.getElementById('toast');
    let toastTimer = null;

    function hideToast() {
      toast.classList.remove('show');
      toastTimer = null;
    }

    function showUndo(event, index) {
      toast.innerHTML = '';   /* 先清空前一条 */

      const msg = document.createElement('span');
      msg.textContent = '已删除「' + event.name + '」';
      toast.appendChild(msg);

      const undo = document.createElement('button');
      undo.textContent = '撤销';
      undo.onclick = () => {
        events.splice(index, 0, event);   /* 放回原来的位置 */
        saveEvents();
        render();
        hideToast();
      };
      toast.appendChild(undo);

      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(hideToast, 5000);   /* 5 秒后自己消失 */
    }

    /* ===== 删除：先让卡片收起来，再从数据里删掉 ===== */
    function delEvent(event, card) {
      const index = events.indexOf(event);
      if (revealedCard === card) revealedCard = null;
      clearTimeout(retractTimer);
      retractTimer = null;

      /* 1. 先记下现在的高度，再归零 —— 高度、上下内边距、下外边距一起收，
            下面的卡片才会顺着往上移，而不是"啪"地跳上去 */
      card.style.height = card.offsetHeight + 'px';
      card.style.overflow = 'hidden';
      void card.offsetHeight;            /* 逼浏览器结算一次，动画才会触发 */
      card.style.height = '0px';
      card.style.paddingTop = '0px';
      card.style.paddingBottom = '0px';
      card.style.marginBottom = '0px';
      card.style.borderWidth = '0px';
      card.style.opacity = '0';

      /* 2. 动画放完（0.25 秒）之后，才真正从数据里删掉并重画 */
      setTimeout(() => {
        events.splice(index, 1);
        saveEvents();
        render();
        showUndo(event, index);
      }, 260);
    }

    /* ===== 造"第一张"卡片：放大 + 翻页时钟 ===== */
    let clockTimer = null;      /* 记住那个"每秒更新"的定时器 */

    function makeFeaturedCard(event) {
      const card = document.createElement('div');
      card.className = 'card featured';
      attachLongPress(card);
      card.appendChild(makeDeleteBtn(event, card));

      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = event.name;
      card.appendChild(name);

      const clock = buildFlipClock();
      clock.apply(event.date, false);        /* 先摆好，不动画 */
      card.appendChild(clock.el);

      clockTimer = setInterval(() => clock.apply(event.date, true), 1000);   /* 每秒翻 */
      return card;
    }

    /* ===== 渲染：先排序，再画卡片 ===== */
    const list = document.getElementById('list');

    function render() {
      if (clockTimer) { clearInterval(clockTimer); clockTimer = null; }   /* 停掉旧的每秒定时器 */
      list.innerHTML = '';                                                /* 清空列表 */
      revealedCard = null;                                                /* 卡片全重建了，旧引用作废 */
      clearTimeout(retractTimer);
      retractTimer = null;                                                /* 收回定时器也一并清掉 */

      const sorted = [...events].sort((a, b) => daysLeft(a.date) - daysLeft(b.date));  /* 天少的排前面 */

      if (sorted.length === 0) {                                          /* 一个都没有：总得说句话 */
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = '还没有惦记的事，在上面加一个吧';
        list.appendChild(empty);
        return;
      }

      sorted.forEach((event, i) => {
        if (i === 0) list.appendChild(makeFeaturedCard(event));   /* 第一张：放大版 */
        else         list.appendChild(makeCard(event));           /* 其余：普通版 */
      });
    }

    render();   /* 先画一次 */

    /* ===== 添加 ===== */
    const nameInput = document.getElementById('nameInput');
    const dateInput = document.getElementById('dateInput');
    const addBtn    = document.getElementById('addBtn');
    const addHint   = document.getElementById('addHint');

    function addEvent() {
      const name = nameInput.value.trim();
      const date = dateInput.value;

      /* 先给漏填的那格描红 —— 否则点了按钮毫无反应，用户会以为坏了 */
      nameInput.classList.toggle('invalid', !name);
      dateInput.classList.toggle('invalid', !date);

      if (!name || !date) {
        addHint.textContent = '名字和日期都要填';
        return;
      }

      addHint.textContent = '';
      events.push({ name: name, date: date });
      saveEvents();                 /* 存一份，关了也不丢 */
      nameInput.value = '';
      dateInput.value = '';
      nameInput.focus();            /* 光标回到名字格，好连着加下一个 */
      render();                     /* 重画：自动重新排序 */
    }

    addBtn.onclick = addEvent;

    /* 填完日期直接按回车也能添加；一动手打字就清掉红框和提示 */
    [nameInput, dateInput].forEach(el => {
      el.addEventListener('keydown', e => { if (e.key === 'Enter') addEvent(); });
      el.addEventListener('input', () => {
        el.classList.remove('invalid');
        addHint.textContent = '';
      });
    });
  </script>
</body>
</html>
